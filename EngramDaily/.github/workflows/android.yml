name: Android build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK components
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Core checks
        run: sh tests/run.sh
      - name: Build debug APK and run lint
        run: sh gradlew :app:assembleDebug :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: engram-daily-debug
          path: app/build/outputs/apk/debug/app-debug.apk
